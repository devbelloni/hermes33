version: '3.9'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: hermes33
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Não exponha a porta 11434 para o host (só interno)
    # ports:
    #   - "9010:11434"   # ← comente ou remova
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  fastapi:
    build: .          # vamos criar uma pasta fastapi com o código
    container_name: fastapi-hermes33
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - API_KEYS=sk-minha-chave-secreta-123,sk-outra-chave-456   # separe por vírgula
    depends_on:
      - ollama

volumes:
  ollama_data:
